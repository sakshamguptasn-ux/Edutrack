{% extends "base.html" %}
{% block title %}Register — EduTrack{% endblock %}

{% block content %}
<div class="login-container">
    <div class="card">
        <div class="text-center mb-4">
            <i class="bi bi-mortarboard-fill" style="font-size: 2.5rem; color: var(--primary);"></i>
            <h3 class="mt-2 fw-bold" style="color: var(--primary-dark);">EduTrack</h3>
            <p class="text-muted">Create your account</p>
        </div>
        <h5 class="text-center mb-3">Register</h5>
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name"
                       placeholder="Enter your full name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="At least 6 characters" required minlength="6">
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                       placeholder="Re-enter your password" required>
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select class="form-select" id="role" name="role" required onchange="togglePasscode(this.value)">
                    <option value="student" selected>Student</option>
                    <option value="faculty">Faculty</option>
                </select>
            </div>

            <!-- Faculty Passcode field — hidden by default, shown only when Faculty is selected -->
            <div class="mb-3" id="passcode-group" style="display: none;">
                <label for="faculty_passcode" class="form-label">
                    <i class="bi bi-shield-lock me-1"></i>Faculty Authorization Code
                </label>
                <input type="password" class="form-control" id="faculty_passcode" name="faculty_passcode"
                       placeholder="Enter the faculty passcode provided by your administrator">
                <div class="form-text text-muted">
                    <i class="bi bi-info-circle me-1"></i>Contact your system administrator to obtain this code.
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-person-plus me-1"></i>Create Account
            </button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">
                Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
            </small>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePasscode(role) {
    const group = document.getElementById('passcode-group');
    const input = document.getElementById('faculty_passcode');
    if (role === 'faculty') {
        group.style.display = 'block';
        input.required = true;
    } else {
        group.style.display = 'none';
        input.required = false;
        input.value = '';
    }
}
</script>
{% endblock %}
