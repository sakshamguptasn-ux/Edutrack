{% extends "base.html" %}
{% block title %}Final Submission — EduTrack{% endblock %}

{% block content %}
<div class="page-header"><h2><i class="bi bi-check-circle me-2"></i>Final Submission: {{ project['title'] }}</h2></div>

<div class="row"><div class="col-md-8">
<div class="card">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="file" class="form-label">Upload Final Submission</label>
                <input type="file" class="form-control" id="file" name="file" accept=".pdf,.doc,.docx,.ppt,.pptx" required>
                <div class="form-text">Allowed: PDF, DOC, DOCX, PPT, PPTX. Max: 16 MB.</div>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3" placeholder="Describe your final submission..."></textarea>
            </div>
            <button type="submit" class="btn btn-success"><i class="bi bi-check-circle me-1"></i>Submit Final</button>
            <a href="{{ url_for('student.project_detail', project_id=project['project_id']) }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
</div></div>
{% endblock %}
