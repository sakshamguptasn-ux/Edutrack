{% extends "base.html" %}
{% block title %}Create Team — EduTrack{% endblock %}

{% block content %}
<div class="page-header"><h2><i class="bi bi-people me-2"></i>Create New Team</h2></div>

<div class="row"><div class="col-md-6">
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="team_name" class="form-label">Team Name</label>
                <input type="text" class="form-control" id="team_name" name="team_name" required placeholder="Enter team name">
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Create Team</button>
            <a href="{{ url_for('student.teams') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
</div></div>
{% endblock %}
