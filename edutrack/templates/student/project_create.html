{% extends "base.html" %}
{% block title %}Create Project — EduTrack{% endblock %}

{% block content %}
<div class="page-header"><h2><i class="bi bi-folder-plus me-2"></i>Create Project under {{ assignment['title'] }}</h2></div>

<div class="row"><div class="col-md-8">
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="team_id" class="form-label">Team</label>
                <select class="form-select" id="team_id" name="team_id" required>
                    <option value="">Select a team...</option>
                    {% for t in teams %}
                    <option value="{{ t['team_id'] }}">{{ t['team_name'] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="title" class="form-label">Project Title</label>
                <input type="text" class="form-control" id="title" name="title" required placeholder="Enter project title">
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="4" placeholder="Describe your project..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Create Project</button>
            <a href="{{ url_for('student.assignment_detail', assignment_id=assignment['assignment_id']) }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
</div></div>
{% endblock %}
