{% extends "base.html" %}
{% block title %}Sign In — EduTrack{% endblock %}

{% block content %}
<div class="login-container">
    <div class="card">
        <div class="text-center mb-4">
            <i class="bi bi-mortarboard-fill" style="font-size: 2.5rem; color: var(--primary);"></i>
            <h3 class="mt-2 fw-bold" style="color: var(--primary-dark);">EduTrack</h3>
            <p class="text-muted">Student Academic Project Management</p>
        </div>
        <h5 class="text-center mb-3">Sign In</h5>
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="Enter your email" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
            </button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">
                Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
            </small>
        </div>
    </div>
</div>
{% endblock %}
