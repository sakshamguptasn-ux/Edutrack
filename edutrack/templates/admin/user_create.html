{% extends "base.html" %}
{% block title %}Add User — EduTrack{% endblock %}

{% block content %}
<div class="page-header"><h2><i class="bi bi-person-plus me-2"></i>Add New User</h2></div>
<div class="row"><div class="col-md-6">
<div class="card"><div class="card-body">
    <form method="POST">
        <div class="mb-3"><label class="form-label">Full Name</label><input type="text" class="form-control" name="name" required></div>
        <div class="mb-3"><label class="form-label">Email Address</label><input type="email" class="form-control" name="email" required></div>
        <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required minlength="6"></div>
        <div class="mb-3"><label class="form-label">Role</label>
            <select class="form-select" name="role" required>
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>Create User</button>
        <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
</div></div>
</div></div>
{% endblock %}
